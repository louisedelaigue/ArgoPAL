[build-system]
requires = [
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "argopal"
description = "Wind from passive acoustics on BGC-Argo floats"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Louise Delaigue" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
    "cartopy",
    "gsw",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pandas",
    "scipy",
    "xarray",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/louisedelaigue/ArgoPAL"
Documentation = "https://argopal.readthedocs.io"
Issues = "https://github.com/louisedelaigue/ArgoPAL/issues"

[project.optional-dependencies]
ais = ["pyais"]
docs = [
    "furo",
    "myst-nb",
    "sphinx",
    "sphinx-copybutton",
]

[tool.setuptools.packages.find]
include = ["argopal*"]

[tool.setuptools.dynamic]
version = {attr = "argopal.meta.__version__"}

[tool.ruff]
line-length = 79

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.coverage.run]
source = ["argopal"]

[dependency-groups]
dev = [
    "ipykernel",
    "genbadge[coverage]",
    "pytest",
    "pytest-cov",
]
